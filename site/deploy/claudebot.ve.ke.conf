# nginx vhost for claudebot.ve.ke — static landing page on the VE.KE box.
# Install:
#   sudo cp claudebot.ve.ke.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/claudebot.ve.ke.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d claudebot.ve.ke      # adds the TLS block + 80->443 redirect

server {
    listen 80;
    listen [::]:80;
    server_name claudebot.ve.ke;

    root /var/www/claudebot.ve.ke;
    index index.html;

    # Serve the installer as a shell script so `curl -fsSL claudebot.ve.ke/install.sh | bash` works.
    location = /install.sh {
        default_type application/x-sh;
        add_header Content-Disposition "inline";
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache for static assets.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Don't serve the deploy/ folder publicly.
    location ^~ /deploy/ { return 404; }

    access_log /var/log/nginx/claudebot.ve.ke.access.log;
    error_log  /var/log/nginx/claudebot.ve.ke.error.log;
}
